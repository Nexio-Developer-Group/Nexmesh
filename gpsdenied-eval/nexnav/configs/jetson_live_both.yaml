# Live on a Jetson: CSI camera + autopilot on a UART, both engines for redundancy.
run: {name: flight, engines: [s6, s5], output_dir: ~/nexnav_runs, realtime: true}
camera:
  source: "csi:0"                 # or "v4l2:/dev/video0" or "gst:<pipeline> ! appsink"
  width: 1280
  height: 800
  fps: 30
  hfov_deg: 60.0                  # or fx/fy/cx/cy from your calibration
  mount: nadir_stabilised         # body_fixed if the camera is rigid on the airframe
map: {path: ~/maps/area.tif, cache_dir: ~/.nexnav/cache}
telemetry:
  source: mavlink
  mavlink: {connection: "serial:/dev/ttyTHS1:921600"}
  altitude: {source: relative_alt, offset_m: 0.0, min_m: 60, max_m: 600}
  gps_reference: gps_raw
engines:
  device: auto
  s6: {tile_scales_m: [75.0, 145.0, 290.0, 580.0], tracking: true}
  s5: {repo_path: ~/.nexnav/third_party/SWA-PF, n_particles: 20000, hmin_m: 50, hmax_m: 550}
fusion: {mode: agree_or_best, primary: s6, agree_radius_m: 30}
output:
  mavlink_gps_input: {enabled: false}   # enable only after SITL testing
