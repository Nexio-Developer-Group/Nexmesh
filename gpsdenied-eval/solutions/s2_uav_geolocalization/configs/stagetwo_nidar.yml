# Stage 2 (VICReg) for NIDAR reference map (derived from caevl/ft_stage/configs/config_stagetwo_vild.yml; CPU)
image_size: [256, 256]
seed: 0
architecture:
  device: 'cpu'
  dir_model: 'AutoEncoder'
  backbone: 'stageone_nidar'
  invariance_coeff: 25
  std_coeff: 25
  cov_coeff: 1
  alpha: 0.75
Dataset:
  images_directory: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/train'
  val_images_directory: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/val'
  path_dict_coordinates: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/coords.pkl'
  path_dict_coordinates_val: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/coords.pkl'
  grayscale: True
  use_PIL: True
  apply_transform: True
  apply_normalization: False
  canny_edges: True
  return_locations: True
  transform: {rot_degrees: 30, translate: [10, 10], blur_kernel_size: 5, brightness_factor: 0.3, contrast_factor: 0.3, noise_mean: 0, noise_std: 0.1, zoom_in_prob: 0.8, blur_prob: 0.25, brightness_prob: 0.5, contrast_prob: 0.5, noise_prob: 0, vignetting_prob: 0.5, masking_prob: 1, vignetting_val: 80}
trainer:
  batch_size: 64
  learning_rate: 6e-5
  num_workers_loader: 1
  patience: 5
  num_epochs: 1
  model_save_path: 'caevl/models/trained/ft/stagetwo_nidar/stagetwo.pth'
  losses_save_dir_path: 'caevl/models/trained/ft/stagetwo_nidar/losses'
  save_checkpoint: 0
  save_optimizer: False
