# Stage 1 for NIDAR reference map (derived from caevl/ae/configs/config_ae_vild.yml; CPU, small budget)
image_size: [256, 256]
seed: 0
AutoEncoder:
  nb_input_channels: 1
  nb_channels_fst_feature_map: 64
  latent_dim: 1024
  learning_rate: 6e-5
  scheduler: True
  loss_name: 'L2'
  device: 'cpu'
  alpha: 1
  flag_perceptual_loss: False
  canny_edges: True
  scalar_divide_channels_fst_feature_map_for_decoder: 1
  encoder_only: False
  softmax: False
  sigmoid: False
  use_cbam: False
Dataset:
  images_directory: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/train'
  val_images_directory: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/val'
  path_dict_coordinates: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/coords.pkl'
  path_dict_coordinates_val: '/home/user/Nexmesh/gpsdenied-eval/solutions/s2_uav_geolocalization/work/train/coords.pkl'
  grayscale: True
  use_PIL: True
  apply_transform: True
  apply_normalization: False
  transform: {rot_degrees: 30, translate: [10, 10], blur_kernel_size: 5, brightness_factor: 0.3, contrast_factor: 0.3, noise_mean: 0, noise_std: 0.1, zoom_in_prob: 0.7, blur_prob: 0.25, brightness_prob: 0.5, contrast_prob: 0.5, noise_prob: 0, vignetting_prob: 0.5, masking_prob: 1, vignetting_val: 80}
trainer:
  batch_size: 32
  num_workers_loader: 1
  patience: 5
  num_epochs: EPOCHS
  model_save_path: 'caevl/models/trained/AutoEncoder/stageone_nidar/stageone.pth'
  losses_save_dir_path: 'caevl/models/trained/AutoEncoder/stageone_nidar/losses'
  force_save: False
  save_checkpoint: 1
  save_optimizer: False
