id: kafka
name: Kafka
monogram: Ka
order: 10
categories:
- messaging
kind: service
description: Distributed event-streaming platform.
supportedModes:
- install
- connect
versions:
  default: 3.8.1
  supported:
  - 3.8.1
  - 3.7.1
install:
  strategy: image
  image: apache/kafka
  ports:
  - 9092
  volumes:
  - name: data
    path: /var/lib/kafka/data
    sizeGB: 10
  env:
    KAFKA_NODE_ID: '1'
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
resources:
  cpu: 1
  ramMB: 1024
  storageGB: 10
health:
  type: tcp
  port: 9092
connection:
  schemes: []
  defaultPort: 9092
  envPrefix: KAFKA
  fields:
  - name: bootstrapServers
    label: Bootstrap servers
    type: string
    required: true
    advanced: false
    placeholder: broker1:9092,broker2:9092
  - name: securityProtocol
    label: Security protocol
    type: select
    required: false
    advanced: true
    default: PLAINTEXT
    options:
    - PLAINTEXT
    - SSL
    - SASL_PLAINTEXT
    - SASL_SSL
  - name: saslMechanism
    label: SASL mechanism
    type: select
    required: false
    advanced: true
    options:
    - PLAIN
    - SCRAM-SHA-256
    - SCRAM-SHA-512
  - name: username
    label: Username or API key
    type: string
    required: false
    advanced: true
  - name: password
    label: Password or API secret
    type: password
    required: false
    advanced: true
  - name: caCertificate
    label: CA certificate
    type: textarea
    required: false
    advanced: true
  - name: tlsInsecure
    label: Skip certificate verification
    type: boolean
    required: false
    advanced: true
    default: false
    help: Encrypts the connection but does not check the server identity. Only use for testing.
  - name: schemaRegistryUrl
    label: Schema registry URL
    type: string
    required: false
    advanced: true
  - name: clientId
    label: Client ID
    type: string
    required: false
    advanced: true
    default: nexmesh
schemaVersion: 1
wiring:
  provides: true
