name: windows-installer

# Builds the double-click Windows installer (Nexmesh-Setup-<version>.exe) and a
# portable zip. Run it from the Actions tab ("Run workflow"), or push a v* tag to
# also attach the installer to a GitHub release. Download the file from the run's
# "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Build the installer
        run: ONLY_WINDOWS=1 scripts/build-release.sh "${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
      - uses: actions/upload-artifact@v4
        with:
          name: nexmesh-windows-installer
          path: |
            dist/Nexmesh-Setup-*.exe
            dist/nexmesh-*-windows-amd64.zip
            dist/SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Nexmesh-Setup-*.exe
            dist/nexmesh-*-windows-amd64.zip
            dist/SHA256SUMS
          generate_release_notes: true
